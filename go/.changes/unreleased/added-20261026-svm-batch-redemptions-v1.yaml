kind: added
body: 'SVM batch-settlement: facilitator-built redemptions (claim, settle, seal, refund, rent cleanup) are built as Solana transaction v1 by default, with a compute unit limit sized for the batch (25,000 + 25,000 per channel, capped at 1,400,000) and a 4 MiB loaded-account-data budget. The facilitator advertises its per-transaction capacity as extra.maxClaimChannels and extra.maxSettleChannels (18 and 13 for v1, 4 for v0), rejects a larger claim or settle request with invalid_batch_settlement_svm_payload_type, and fails a redemption that does not fit rather than truncating it. Config.UseTransactionV0 (and RentCleanupConfig.UseTransactionV0) keeps redemptions on version 0 with a capacity of 4. The server copies the capacity into PaymentRequirements.extra and sizes claim and settle batches by it (4 when absent), lowered by MaxChannelsPerBatch when set.'
